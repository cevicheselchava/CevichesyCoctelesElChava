<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#078844">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Panel Operativo">
  <title>Instalar Panel Operativo</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20260907-1819">
  <link rel="icon" href="./icon-192.png?v=20260907-1819" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icon-192.png?v=20260907-1819">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#17211d;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:white;border-radius:26px;padding:26px 22px;box-shadow:0 12px 34px rgba(0,0,0,.10);text-align:center;border-top:8px solid #078844}.icon{width:118px;height:118px;border-radius:26px;box-shadow:0 7px 18px rgba(0,0,0,.12)}h1{font-size:30px;margin:18px 0 8px}p{font-size:17px;line-height:1.4;color:#5e6a64;margin:0 0 20px}.open{display:block;text-decoration:none;background:#078844;color:white;font-weight:900;font-size:19px;padding:15px 18px;border-radius:15px}.hint{margin-top:18px;padding-top:16px;border-top:1px solid #e3e9e5;font-size:15px;color:#38443e}.stripes{height:5px;border-radius:999px;margin:16px 0;background:linear-gradient(90deg,#078844 0 34%,#ffd52f 34% 67%,#ef2e37 67%)}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./icon-192.png?v=20260907-1819" alt="Panel Operativo">
    <h1>Panel Operativo</h1>
    <div class="stripes"></div>
    <p>Esta es la entrada de instalación del panel administrativo.</p>
    <a class="open" href="./app.html">Abrir Panel</a>
    <div class="hint">Para instalar: abre el menú de Chrome ⋮ y elige <b>Instalar app</b>.</div>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js?v=2', {scope:'./'}).catch(()=>{});
    }
  </script>
</body>
</html>
