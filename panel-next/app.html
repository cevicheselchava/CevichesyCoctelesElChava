<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#078844">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Panel Operativo · El Cubano</title>
  <link rel="stylesheet" href="./styles.css?v=20260910-0015">
  <link rel="stylesheet" href="./watermarks.css?v=20260910-0015">
  <link rel="stylesheet" href="./admin-shell.css?v=20260910-0015">
  <style id="pedidos-legibilidad">
    [hidden]{display:none!important}.view{display:none}.view.active{display:block}
    .orders-search input,.orders-select,.status-tabs button{font-size:17px}
    .order-card h3{font-size:25px}
    .folio{font-size:13px}
    .status{font-size:12px;padding:9px 12px}
    .order-main-line strong{font-size:18px}
    .order-main-line b{font-size:23px}
    .order-info-grid small{font-size:11px}
    .order-info-grid strong{font-size:16px}
    .order-note{font-size:15px}
    .order-action{font-size:15px;min-height:44px;padding:11px 14px}
    .order-action.edit{background:#e7f2ff;color:#155c91}
    .form-section h3{font-size:23px}
    .form-grid label{font-size:13px}
    .form-grid input,.form-grid select{font-size:19px;min-height:58px}
    .modal-head h2{font-size:36px}
    .modal-head small{font-size:13px}
    .order-preview{font-size:18px}
  </style>
</head>
<body>
  <div class="app">
    <header class="hero" id="hero">
      <div class="hero-row">
        <button class="icon-button" id="menuButton" type="button">☰</button>
        <div class="logo-wrap"><img class="brand-logo" id="brandLogo" alt="Ceviches & Cócteles"></div>
        <div class="title-wrap"><h1 class="panel-title" id="panelTitle">PANEL <span>OPERATIVO</span></h1><div class="side-slogan" id="sideSlogan"></div></div>
        <button class="icon-button bell" id="bellButton" type="button">♨<span class="badge-notify" hidden>0</span></button>
      </div>
    </header>
    <main class="content">
      <section class="view active" id="homeView" data-view="home">
        <div class="module-grid" id="moduleGrid"></div>
        <section class="summary-section"><div class="summary-title-row"><h2 class="summary-title"><span class="bars">≡</span> Resumen del Día</h2><span class="date-pill" id="todayDate"></span></div><div class="summary-grid" id="summaryGrid"></div></section>
        <section class="footer-brand"><div class="footer-slogan" id="footerSlogan"></div><div class="footer-tag" id="footerTag"></div></section>
      </section>
      <section class="view" id="ordersView" data-view="pedidos">
        <div class="module-topbar"><button class="back-button" id="ordersBack" type="button">‹</button><div><small>MÓDULO</small><h2>Pedidos</h2></div><button class="new-order-button" id="newOrderButton" type="button">＋ Pedido</button></div>
        <div class="order-kpis" id="orderKpis"></div>
        <div class="orders-toolbar"><label class="orders-search">⌕<input id="orderSearch" placeholder="Buscar cliente, folio o teléfono"></label><select class="orders-select" id="orderDayFilter"><option value="today">Pedidos hoy</option><option value="all">Todos los días</option></select></div>
        <div class="status-tabs" id="statusTabs"><button class="active" data-status="active">Activos</button><button data-status="pending">Pendientes</button><button data-status="ready">Listos</button><button data-status="delivered">Entregados</button><button data-status="all">Todos</button></div>
        <div class="orders-list" id="ordersList"></div>
      </section>
      <section class="view" id="purchasesView" data-view="compras"><div class="module-topbar"><button class="back-button" data-back-home type="button">‹</button><div><small>MÓDULO</small><h2>Compras</h2></div><button class="new-order-button" id="simpleNewPurchase" type="button">＋ Compra</button></div><div class="purchase-kpis" id="purchaseKpis"></div><div id="purchaseSimple"></div><div class="purchase-history" id="purchaseHistory"></div></section>
      <section class="view" id="inventoryView" data-view="inventario"><div class="module-topbar"><button class="back-button" data-back-home type="button">‹</button><div><small>MÓDULO</small><h2>Inventario</h2></div><button class="new-order-button" id="newInventoryItem" type="button">＋ Producto</button></div><div class="inventory-toolbar"><label class="inventory-search">⌕<input id="inventorySearch" placeholder="Buscar producto"></label></div><div class="inventory-category-nav" id="inventoryCategoryNav"></div><div class="inventory-list" id="inventoryList"></div></section>
      <section class="view" id="moneyView" data-view="dinero"><div class="module-topbar"><button class="back-button" data-back-home type="button">‹</button><div><small>MÓDULO</small><h2>Dinero</h2></div><button class="new-order-button" id="newExpenseButton" type="button">＋ Gasto</button></div><div class="money-tabs" id="moneyTabs"><button class="active" data-money-tab="summary">Resumen</button><button data-money-tab="sales">Ventas</button><button data-money-tab="expenses">Gastos</button></div><div id="moneyContent"></div></section>
      <section class="view" id="recipesView" data-view="recetas"><div class="module-topbar"><button class="back-button" data-back-home type="button">‹</button><div><small>MÓDULO</small><h2>Recetas</h2></div><button class="new-order-button" id="newRecipeButton" type="button">＋ Receta</button></div><div class="recipe-kpis" id="recipeKpis"></div><div class="recipes-list" id="recipesList"></div></section>
      <section class="view" id="deliveriesView" data-view="entregas"><div class="module-topbar"><button class="back-button" data-back-home type="button">‹</button><div><small>MÓDULO</small><h2>Entregas</h2></div><button class="new-order-button" id="refreshDeliveries" type="button">↻ Actualizar</button></div><div class="delivery-tabs" id="deliveryTabs"><button class="active" data-delivery-filter="today">Hoy</button><button data-delivery-filter="ready">Listos</button><button data-delivery-filter="route">En ruta</button><button data-delivery-filter="delivered">Entregados</button></div><div class="delivery-list" id="deliveryList"></div></section>
      <section class="view" id="preparationView" data-view="preparacion"><div class="module-topbar"><button class="back-button" data-back-home type="button">‹</button><div><small>MÓDULO</small><h2>Preparación</h2></div><button class="new-order-button" id="refreshPreparation" type="button">↻ Actualizar</button></div><div class="prep-kpis" id="prepKpis"></div><div class="prep-dish-panel" id="prepDishPanel"></div><div class="prep-tabs" id="prepTabs"><button class="active" data-prep-filter="pending">Pendientes</button><button data-prep-filter="preparing">Preparando</button><button data-prep-filter="ready">Listos</button><button data-prep-filter="all">Todos</button></div><div class="prep-list" id="prepList"></div></section>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal"><button class="active" type="button" data-nav="inicio"><span class="nav-icon">⌂</span><span>Inicio</span></button><button type="button" data-nav="reportes"><span class="nav-icon">▥</span><span>Reportes</span></button><button type="button" data-nav="configuracion"><span class="nav-icon">⚙</span><span>Configuración</span></button><button type="button" data-nav="perfil"><span class="nav-icon">●</span><span>Perfil</span></button></nav>
  <div class="modal" id="orderModal" hidden><section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle"><div class="modal-head"><div><small id="orderModalEyebrow">NUEVO</small><h2 id="orderModalTitle">Pedido</h2></div><button class="modal-close" id="closeOrderModal" type="button">×</button></div><form id="orderForm"><div class="form-section"><h3>Producto</h3><div class="form-grid two"><label class="full">Producto<input id="orderProductName" list="productOptions" placeholder="Nombre del producto" required></label><datalist id="productOptions"></datalist><label>Cantidad<input id="orderQty" type="number" min="0.01" step="0.01" value="1" required></label><label>Unidad<input id="orderUnit" list="unitOptions" placeholder="orden, lb, pieza..." required></label><datalist id="unitOptions"></datalist><label class="full">Precio unitario<input id="orderPrice" type="number" min="0" step="0.01" placeholder="Escribe el precio" required></label></div></div><div class="form-section"><h3>Cliente</h3><div class="form-grid two"><label>Nombre<input id="orderCustomer" autocomplete="name" required></label><label>Teléfono<input id="orderPhone" type="tel" autocomplete="tel"></label><label class="full">Dirección<input id="orderAddress" autocomplete="street-address"></label><label>ZIP<input id="orderZip" inputmode="numeric"></label><label>Origen<select id="orderSource"></select></label></div></div><div class="form-section"><h3>Entrega y pago</h3><div class="form-grid two"><label>Día<input id="orderDate" type="date" required></label><label>Hora<input id="orderTime" type="time" required></label><label>Pago<select id="orderPayment"></select></label><label>Estado<select id="orderPaymentStatus"><option value="pending">Pendiente</option><option value="paid">Pagado</option></select></label><label class="full">Notas<input id="orderNotes" placeholder="Sin cebolla, llamar al llegar, etc."></label></div></div><div class="order-preview" id="orderPreview"></div><div class="modal-actions"><button class="secondary-action" id="cancelOrder" type="button">Cancelar</button><button class="primary-action" id="saveOrderButton" type="submit">Guardar pedido</button></div></form></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./business-core-ui.js?v=20260910-0016"></script>
  <script type="module" src="./app.js?v=20260910-0015"></script>
  <script type="module" src="./preparation.js?v=20260910-0015"></script>
  <script type="module" src="./inventory.js?v=20260910-0015"></script>
  <script type="module" src="./recipes.js?v=20260910-0015"></script>
  <script type="module" src="./purchases.js?v=20260910-0828"></script>
  <script type="module" src="./deliveries.js?v=20260910-1645"></script>
  <script type="module" src="./money.js?v=20260910-0015"></script>
  <script type="module" src="./admin-shell.js?v=20260910-0015"></script>
  <script type="module" src="./firebase-sync.js?v=20260910-0015"></script>
  <script type="module" src="./orders-ui.js?v=20260910-1015"></script>
  <script type="module" src="./orders-polish.js?v=20260910-1645"></script>
</body>
</html>
