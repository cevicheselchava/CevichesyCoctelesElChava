<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#078844">
  <title>Panel Operativo · El Cubano</title>
  <link rel="stylesheet" href="./styles.css">
  <style id="pedidos-legibilidad">
    .orders-search input,.orders-select,.status-tabs button{font-size:17px}
    .order-card h3{font-size:25px}
    .folio{font-size:13px}
    .status{font-size:12px;padding:9px 12px}
    .order-main-line strong{font-size:18px}
    .order-main-line b{font-size:23px}
    .order-info-grid small{font-size:11px}
    .order-info-grid strong{font-size:16px}
    .order-note{font-size:15px}
    .order-action{font-size:15px;min-height:44px;padding:11px 14px}
    .order-action.edit{background:#e7f2ff;color:#155c91}
    .form-section h3{font-size:23px}
    .form-grid label{font-size:13px}
    .form-grid input,.form-grid select{font-size:19px;min-height:58px}
    .modal-head h2{font-size:36px}
    .modal-head small{font-size:13px}
    .order-preview{font-size:18px}
    .primary-action,.secondary-action{font-size:17px;min-height:52px}
    @media(max-width:720px){
      .module-topbar h2{font-size:38px}
      .new-order-button{font-size:18px}
      .order-kpi small{font-size:12px}
      .order-kpi strong{font-size:29px}
      .order-card{padding:18px}
      .order-card-actions{flex-wrap:wrap}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero" id="hero">
      <div class="hero-row">
        <button class="icon-button" id="menuButton" type="button" aria-label="Abrir menú">☰</button>
        <div class="logo-wrap"><img id="brandLogo" class="brand-logo" alt="Logo del negocio"></div>
        <div class="title-wrap">
          <h1 class="panel-title" id="panelTitle">PANEL <span>OPERATIVO</span></h1>
          <div class="side-slogan" id="sideSlogan">Good Food<br>Good Vibes</div>
        </div>
        <button class="icon-button bell" id="bellButton" type="button" aria-label="Notificaciones">♧<span class="badge-notify">3</span></button>
      </div>
    </header>

    <main class="content">
      <section class="view active" id="homeView" data-view="home">
        <section class="module-grid" id="moduleGrid" aria-label="Módulos del sistema"></section>
        <section class="summary-section">
          <div class="summary-title-row">
            <h2 class="summary-title"><span class="bars">▂▅▇</span> Resumen de hoy</h2>
            <div class="date-pill">▣ <span id="todayDate">Hoy</span></div>
          </div>
          <div class="summary-grid" id="summaryGrid"></div>
        </section>
        <footer class="footer-brand">
          <div class="footer-slogan" id="footerSlogan">Ceviches, Cócteles<br>y Buena Vibra</div>
          <div class="footer-tag" id="footerTag">ONE<br>LOVE</div>
        </footer>
      </section>

      <section class="view orders-view" id="ordersView" data-view="pedidos">
        <div class="module-topbar">
          <button class="back-button" id="ordersBack" type="button">‹</button>
          <div>
            <small>MÓDULO</small>
            <h2>Pedidos</h2>
          </div>
          <button class="new-order-button" id="newOrderButton" type="button">＋ Pedido</button>
        </div>

        <div class="order-kpis" id="orderKpis"></div>

        <div class="orders-toolbar">
          <label class="orders-search">⌕ <input id="orderSearch" type="search" placeholder="Buscar cliente, folio o teléfono"></label>
          <select id="orderDayFilter" class="orders-select" aria-label="Día">
            <option value="today">Hoy</option>
            <option value="all">Todos</option>
          </select>
        </div>

        <div class="status-tabs" id="statusTabs">
          <button class="active" data-status="active">Activos</button>
          <button data-status="pending">Pendientes</button>
          <button data-status="ready">Listos</button>
          <button data-status="delivered">Entregados</button>
          <button data-status="all">Todos</button>
        </div>

        <div class="orders-list" id="ordersList"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal">
    <button class="active" type="button" data-nav="inicio"><span class="nav-icon">⌂</span><span>Inicio</span></button>
    <button type="button" data-nav="reportes"><span class="nav-icon">▥</span><span>Reportes</span></button>
    <button type="button" data-nav="configuracion"><span class="nav-icon">⚙</span><span>Configuración</span></button>
    <button type="button" data-nav="perfil"><span class="nav-icon">●</span><span>Perfil</span></button>
  </nav>

  <div class="modal" id="orderModal" hidden>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
      <div class="modal-head">
        <div><small id="orderModalEyebrow">NUEVO</small><h2 id="orderModalTitle">Pedido</h2></div>
        <button class="modal-close" id="closeOrderModal" type="button">×</button>
      </div>

      <form id="orderForm">
        <div class="form-section">
          <h3>Producto</h3>
          <div class="form-grid two">
            <label class="full">Producto<input id="orderProductName" list="productOptions" placeholder="Nombre del producto" required></label>
            <datalist id="productOptions"></datalist>
            <label>Cantidad<input id="orderQty" type="number" min="0.01" step="0.01" value="1" required></label>
            <label>Unidad<input id="orderUnit" list="unitOptions" placeholder="orden, lb, pieza..." required></label>
            <datalist id="unitOptions"></datalist>
            <label class="full">Precio unitario<input id="orderPrice" type="number" min="0" step="0.01" placeholder="Escribe el precio" required></label>
          </div>
        </div>

        <div class="form-section">
          <h3>Cliente</h3>
          <div class="form-grid two">
            <label>Nombre<input id="orderCustomer" autocomplete="name" required></label>
            <label>Teléfono<input id="orderPhone" type="tel" autocomplete="tel"></label>
            <label class="full">Dirección<input id="orderAddress" autocomplete="street-address"></label>
            <label>ZIP<input id="orderZip" inputmode="numeric"></label>
            <label>Origen<select id="orderSource"></select></label>
          </div>
        </div>

        <div class="form-section">
          <h3>Entrega y pago</h3>
          <div class="form-grid two">
            <label>Día<input id="orderDate" type="date" required></label>
            <label>Hora<input id="orderTime" type="time" required></label>
            <label>Pago<select id="orderPayment"></select></label>
            <label>Estado<select id="orderPaymentStatus"><option value="pending">Pendiente</option><option value="paid">Pagado</option></select></label>
            <label class="full">Notas<input id="orderNotes" placeholder="Sin cebolla, llamar al llegar, etc."></label>
          </div>
        </div>

        <div class="order-preview" id="orderPreview"></div>
        <div class="modal-actions">
          <button class="secondary-action" id="cancelOrder" type="button">Cancelar</button>
          <button class="primary-action" id="saveOrderButton" type="submit">Guardar pedido</button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
