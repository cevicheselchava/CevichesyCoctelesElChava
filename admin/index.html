<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel El Cubano">
<title>Panel Operativo El Cubano</title>
<link rel="manifest" href="/admin/manifest.webmanifest?v=20260814-17">
<link rel="icon" href="/pwa-icon.svg?v=20260814-17" type="image/svg+xml">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff9ed;font-family:Arial,Helvetica,sans-serif}
#panel{display:block;width:100%;height:100%;border:0;background:#fff9ed;visibility:hidden;opacity:0;transition:opacity .12s ease}
#panel.ready{visibility:visible;opacity:1}
#panelLoader{position:fixed;inset:0;display:grid;place-items:center;background:#fff9ed;color:#1f6f3b;font-weight:900;font-size:18px;z-index:20}
#panelLoader[hidden]{display:none}
</style>
</head>
<body>
<div id="panelLoader">Cargando panel...</div>
<iframe id="panel" title="Panel Operativo El Cubano"></iframe>
<script>
const panel=document.getElementById('panel');
const panelLoader=document.getElementById('panelLoader');
let revealTimer=null;

function revealPanel(){
  if(revealTimer){clearTimeout(revealTimer);revealTimer=null;}
  panel.classList.add('ready');
  panelLoader.hidden=true;
}

async function clearOldAdminCache(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>String(r.scope||'').includes('/admin/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('el-cubano-admin-')).map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('No se pudo limpiar cache anterior:',e);}
}

function addScript(doc,id,src,onload){
  if(doc.getElementById(id)){if(onload)onload();return;}
  const s=doc.createElement('script');
  s.id=id;
  s.src=src;
  s.onload=()=>{if(onload)onload();};
  s.onerror=()=>{console.error('No cargó',src);if(onload)onload();};
  doc.body.appendChild(s);
}

function injectStableModules(){
  try{
    const doc=panel.contentDocument;
    if(!doc||!doc.body){revealPanel();return;}

    if(!doc.getElementById('adminHideFooter')){
      const st=doc.createElement('style');
      st.id='adminHideFooter';
      st.textContent='.footer{display:none!important}body{padding-bottom:0!important}#purchaseCalc{display:none!important}';
      doc.head.appendChild(st);
    }

    addScript(doc,'manualSaveFix','/admin/manual-save-fix.js?v=20260814-17',()=>{
      addScript(doc,'adminOrdersEnhancement','/admin/admin-orders.js?v=20260814-17',()=>{
        addScript(doc,'prepareRecipeEnhancement','/admin/prepare-recipe.js?v=20260814-17',revealPanel);
      });
    });

    revealTimer=setTimeout(revealPanel,5000);
  }catch(e){
    console.error('Error cargando panel estable:',e);
    revealPanel();
  }
}

panel.addEventListener('load',injectStableModules);
panel.addEventListener('error',revealPanel);

clearOldAdminCache().finally(()=>{
  panel.src='/control.html?admin_shell=1&safe=1&v=20260814-17';
});
setTimeout(revealPanel,8000);
</script>
</body>
</html>
