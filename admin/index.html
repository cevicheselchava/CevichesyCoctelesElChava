<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f3b">
<title>Panel Operativo El Cubano</title>
<style>html,body{margin:0;min-height:100%;background:#fff9ed;font-family:Arial,Helvetica,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;color:#174f2b;font-weight:900}</style>
</head>
<body>
<div id="loading">Cargando panel…</div>
<script>
(async()=>{
  try{
    const r=await fetch('/admin/panel-base.html?v=20260819-1',{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar el panel');
    let html=await r.text();
    html=html.replace('</body>','<script src="/admin/cocktail-sync.js?v=20260819-1"><\/script><script src="/admin/purchase-entry-v2.js?v=20260819-1"><\/script><script src="/admin/inventory-card-actions.js?v=20260819-1"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').textContent='No se pudo cargar el panel. Recarga la página.';
    console.error(e);
  }
})();
</script>
</body>
</html>
