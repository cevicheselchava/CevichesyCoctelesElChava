<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel El Cubano">
<title>Panel Operativo El Cubano</title>
<link rel="manifest" href="/admin/manifest.webmanifest?v=20260814-10">
<link rel="icon" href="/pwa-icon.svg?v=20260814-10" type="image/svg+xml">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff9ed;font-family:Arial,Helvetica,sans-serif}
#panel{display:block;width:100%;height:100%;border:0;background:#fff9ed;visibility:hidden;opacity:0;transition:opacity .12s ease}
#panel.ready{visibility:visible;opacity:1}
#panelLoader{position:fixed;inset:0;display:grid;place-items:center;background:#fff9ed;color:#1f6f3b;font-weight:900;font-size:18px;z-index:20}
#panelLoader[hidden]{display:none}
#installPanel{position:fixed;right:14px;bottom:18px;z-index:99999;border:0;border-radius:15px;padding:14px 17px;background:#1f6f3b;color:#fff;font-weight:900;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.26);display:none}
#installPanel.show{display:block}
@media(display-mode:standalone){#installPanel{display:none!important}}
</style>
</head>
<body>
<div id="panelLoader">Cargando panel...</div>
<iframe id="panel" title="Panel Operativo El Cubano"></iframe>
<button id="installPanel" type="button">📲 INSTALAR PANEL</button>
<script>
let installPrompt=null;
const installButton=document.getElementById('installPanel');
const panel=document.getElementById('panel');
const panelLoader=document.getElementById('panelLoader');
let revealTimer=null;
let hardRevealTimer=null;

function revealPanel(){
  if(revealTimer){clearTimeout(revealTimer);revealTimer=null;}
  if(hardRevealTimer){clearTimeout(hardRevealTimer);hardRevealTimer=null;}
  panel.classList.add('ready');
  panelLoader.hidden=true;
}

function injectAdminModules(){
  try{
    const frameDoc=panel.contentDocument;
    if(!frameDoc||!frameDoc.body){revealPanel();return;}

    if(!frameDoc.getElementById('adminHideFooter')){
      const footerStyle=frameDoc.createElement('style');
      footerStyle.id='adminHideFooter';
      footerStyle.textContent='.footer{display:none!important}body{padding-bottom:0!important}#purchaseCalc{display:none!important}';
      frameDoc.head.appendChild(footerStyle);
    }

    if(!frameDoc.getElementById('premiumNavEnhancement')){
      const navPolish=frameDoc.createElement('script');
      navPolish.id='premiumNavEnhancement';
      navPolish.src='/admin/nav-polish.js?v=20260814-10';
      frameDoc.body.appendChild(navPolish);
    }

    if(!frameDoc.getElementById('panelCheerEnhancement')){
      const cheer=frameDoc.createElement('script');
      cheer.id='panelCheerEnhancement';
      cheer.src='/admin/panel-cheer.js?v=20260814-10';
      frameDoc.body.appendChild(cheer);
    }

    if(!frameDoc.getElementById('purchaseFlowEnhancement')){
      const purchaseFlow=frameDoc.createElement('script');
      purchaseFlow.id='purchaseFlowEnhancement';
      purchaseFlow.src='/admin/purchase-flow.js?v=20260814-10';
      frameDoc.body.appendChild(purchaseFlow);
    }

    const loadPrepare=()=>{
      if(frameDoc.getElementById('prepareRecipeEnhancement')||frameDoc.querySelector('.nav button[data-tab="prepare"]')){
        revealPanel();
        return;
      }
      const prep=frameDoc.createElement('script');
      prep.id='prepareRecipeEnhancement';
      prep.src='/admin/prepare-recipe.js?v=20260814-10';
      prep.onload=revealPanel;
      prep.onerror=revealPanel;
      frameDoc.body.appendChild(prep);
    };

    if(frameDoc.getElementById('adminOrdersEnhancement')){
      loadPrepare();
      return;
    }

    const loadOrders=()=>{
      if(frameDoc.getElementById('adminOrdersEnhancement')){loadPrepare();return;}
      const script=frameDoc.createElement('script');
      script.id='adminOrdersEnhancement';
      script.src='/admin/admin-orders.js?v=20260814-10';
      script.onload=loadPrepare;
      script.onerror=loadPrepare;
      frameDoc.body.appendChild(script);
    };

    if(frameDoc.getElementById('manualSaveFix')){
      loadOrders();
    }else{
      const fix=frameDoc.createElement('script');
      fix.id='manualSaveFix';
      fix.src='/admin/manual-save-fix.js?v=20260814-10';
      fix.onload=loadOrders;
      fix.onerror=loadOrders;
      frameDoc.body.appendChild(fix);
    }

    setTimeout(loadPrepare,1800);
    revealTimer=setTimeout(revealPanel,5000);
  }catch(error){
    console.error('No se pudieron cargar los módulos del panel administrador:',error);
    revealPanel();
  }
}

panel.addEventListener('load',injectAdminModules);
panel.addEventListener('error',revealPanel);
hardRevealTimer=setTimeout(revealPanel,8000);
panel.src='/control.html?admin_shell=1&v=20260814-10';

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/admin/service-worker.js?v=20260814-10',{scope:'/admin/'}).catch(console.error);
  });
}

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  installPrompt=event;
  installButton.classList.add('show');
});

installButton.addEventListener('click',async()=>{
  if(!installPrompt)return;
  installButton.disabled=true;
  await installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt=null;
  installButton.classList.remove('show');
  installButton.disabled=false;
});

window.addEventListener('appinstalled',()=>{
  installPrompt=null;
  installButton.classList.remove('show');
});
</script>
</body>
</html>
