<style>html,body{margin:0;min-height:100%;background:#fff9ed;font-family:Arial,Helvetica,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;color:#174f2b;font-weight:900}</style>

<body>
<div id="loading">Cargando panel…</div>
<script>
(async()=>{
  try{
    const r=await fetch('/admin/panel-base.html?v=20260901-01',{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar el panel');
    let html=await r.text();
    html=html.replace("status:'nuevo',deliveryStatus:'por_preparar',directSale:false,createdAt:stamp,createdAtClient:new Date().toISOString()","status:'confirmado',deliveryStatus:'por_preparar',directSale:false,confirmedAt:stamp,createdAt:stamp,createdAtClient:new Date().toISOString()");
    html=html.replace("toast('Pedido guardado');$('orderModal').hidden=true","toast('Pedido ingresado');$('orderModal').hidden=true");
    html=html.replace('</body>','<script src="/admin/cocktail-sync.js?v=20260819-16"><\/script><script src="/admin/inventory-card-actions.js?v=20260819-16"><\/script><script src="/admin/history-actions.js?v=20260819-16"><\/script><script src="/admin/recipe-units.js?v=20260819-16"><\/script><script src="/admin/preparation-recipes.js?v=20260819-16"><\/script><script src="/admin/deliveries-simple.js?v=20260819-16"><\/script><script src="/admin/purchases-simple.js?v=20260819-16"><\/script><script src="/admin/purchase-shopping-list.js?v=20260901-01"><\/script><script src="/admin/sales-profits.js?v=20260819-16"><\/script><script src="/admin/auto-confirm-orders.js?v=20260831-01"><\/script><script src="/admin/order-notifications.js?v=20260831-02"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').textContent='No se pudo cargar el panel. Recarga la página.';
    console.error(e);
  }
})();
</script>
</body>
</html>
