<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel El Cubano">
<title>Panel Operativo El Cubano</title>
<link rel="manifest" href="/admin/manifest.webmanifest?v=20260808-1">
<link rel="icon" href="/pwa-icon.svg?v=20260808-admin" type="image/svg+xml">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff9ed;font-family:Arial,Helvetica,sans-serif}
#panel{display:block;width:100%;height:100%;border:0;background:#fff9ed}
#installPanel{position:fixed;right:14px;bottom:18px;z-index:99999;border:0;border-radius:15px;padding:14px 17px;background:#1f6f3b;color:#fff;font-weight:900;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.26);display:none}
#installPanel.show{display:block}
@media(display-mode:standalone){#installPanel{display:none!important}}
</style>
</head>
<body>
<iframe id="panel" src="/control.html?admin_shell=1" title="Panel Operativo El Cubano"></iframe>
<button id="installPanel" type="button">📲 INSTALAR PANEL</button>
<script>
let installPrompt=null;
const installButton=document.getElementById('installPanel');

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/admin/service-worker.js',{scope:'/admin/'}).catch(console.error);
  });
}

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  installPrompt=event;
  installButton.classList.add('show');
});

installButton.addEventListener('click',async()=>{
  if(!installPrompt)return;
  installButton.disabled=true;
  await installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt=null;
  installButton.classList.remove('show');
  installButton.disabled=false;
});

window.addEventListener('appinstalled',()=>{
  installPrompt=null;
  installButton.classList.remove('show');
});
</script>
</body>
</html>
