<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f3b">
<title>Activar notificaciones · El Cubano</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff,#fff9ed);color:#173047}body{display:grid;place-items:center;padding:18px}.card{width:min(100%,520px);background:#fff;border:1px solid #ded7c8;border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(23,79,43,.13);text-align:center;border-top:7px solid #f2b632}.logo{width:105px;height:105px;object-fit:contain;margin-bottom:8px}.card h1{margin:0;color:#174f2b;font-size:25px}.card p{color:#687386;font-weight:800;line-height:1.45}.status{margin:14px 0;padding:12px;border-radius:13px;background:#eef5ff;color:#123458;font-weight:900;line-height:1.4}.status.ok{background:#eaf8ed;color:#176b2c}.status.error{background:#fff0f0;color:#a51620}button,a{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:1000;font-size:17px;text-decoration:none}button{background:linear-gradient(135deg,#267642,#319552);color:#fff;box-shadow:inset 0 -4px 0 #f2b632}button:disabled{opacity:.55}a{margin-top:9px;background:#eef3f8;color:#123458}.small{font-size:12px;color:#7b8490;margin-top:12px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
</head>
<body>
<main class="card">
<img class="logo" src="/pwa-icon.svg" alt="El Cubano">
<h1>🔔 Avisos de pedidos en línea</h1>
<p>Actívalo una sola vez en este teléfono. Cuando entre un pedido desde la app, recibirás una notificación aunque no tengas abierto el panel.</p>
<div class="status" id="status">Listo para activar.</div>
<button id="activate" type="button">🔔 ACTIVAR NOTIFICACIONES</button>
<a href="/admin/">Volver al panel</a>
<div class="small">El navegador te pedirá permiso para mostrar notificaciones.</div>
</main>
<script>
const firebaseConfig={apiKey:'AIzaSyBbOIXTr2Tvz1FvoTk5GZgP2jx24jpjlL4',authDomain:'ceviches-y-cocteles-el-chava.firebaseapp.com',projectId:'ceviches-y-cocteles-el-chava',storageBucket:'ceviches-y-cocteles-el-chava.firebasestorage.app',messagingSenderId:'227568387475',appId:'1:227568387475:web:6ccd3e67e62d1bf4b0d466'};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const messaging=firebase.messaging();
const statusEl=document.getElementById('status');
const activateBtn=document.getElementById('activate');

function setStatus(text,type=''){
  statusEl.textContent=text;
  statusEl.className='status'+(type?' '+type:'');
}
function deviceId(){
  let id=localStorage.getItem('elCubanoPushDeviceId');
  if(!id){
    id=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`);
    localStorage.setItem('elCubanoPushDeviceId',id);
  }
  return id;
}
async function registerPhone(){
  if(!('Notification' in window)||!('serviceWorker' in navigator))throw new Error('Este navegador no permite notificaciones web.');
  const permission=await Notification.requestPermission();
  if(permission!=='granted')throw new Error('No se dio permiso para notificaciones.');
  const registration=await navigator.serviceWorker.register('/firebase-messaging-sw.js');
  await navigator.serviceWorker.ready;
  const token=await messaging.getToken({serviceWorkerRegistration:registration});
  if(!token)throw new Error('Firebase no pudo registrar este teléfono.');
  const id=deviceId();
  await db.collection('inventario').doc('principal').set({
    pushTokens:{
      [id]:{
        token,
        enabled:true,
        platform:navigator.platform||'',
        userAgent:navigator.userAgent||'',
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      }
    }
  },{merge:true});
  localStorage.setItem('elCubanoPushEnabled','1');
  return token;
}
activateBtn.onclick=async()=>{
  activateBtn.disabled=true;
  setStatus('Activando…');
  try{
    await registerPhone();
    setStatus('✅ Notificaciones activadas en este teléfono.','ok');
    activateBtn.textContent='✅ ACTIVADAS';
    setTimeout(()=>location.href='/admin/',1200);
  }catch(error){
    console.error(error);
    setStatus('⚠️ '+(error.message||'No se pudieron activar.'),'error');
    activateBtn.disabled=false;
  }
};
if(Notification.permission==='granted'&&localStorage.getItem('elCubanoPushEnabled')==='1'){
  setStatus('✅ Este teléfono ya tiene las notificaciones activadas.','ok');
  activateBtn.textContent='🔄 ACTUALIZAR REGISTRO';
}
</script>
</body>
</html>
