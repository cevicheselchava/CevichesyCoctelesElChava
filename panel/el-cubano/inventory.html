<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a43">
<title>Inventario · El Cubano</title>
<link rel="stylesheet" href="../styles.css?v=20260905-2">
<style>
.inv-page{max-width:760px;margin:0 auto;padding:16px 14px 110px}.inv-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.inv-top h1{margin:0;font-size:28px}.inv-top p{margin:4px 0 0;color:#667085}.inv-group{margin-top:18px;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#475467}.inv-row{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:14px;margin-top:9px}.inv-name{font-weight:900;font-size:17px;margin-bottom:10px}.inv-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inv-fields label{font-size:13px;font-weight:800;color:#475467}.inv-fields input{width:100%;box-sizing:border-box;margin-top:6px;font-size:18px;font-weight:800;padding:12px;border:1px solid #d0d5dd;border-radius:12px;background:#fff}.inv-unit{font-size:12px;font-weight:700;color:#98a2b3;margin-top:4px}.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #e4e7ec;z-index:20}.savebar button{max-width:760px;margin:0 auto;display:block;width:100%;font-size:18px}.status{margin:8px 0 14px;padding:11px 12px;border-radius:12px;background:#f2f4f7;color:#475467;font-weight:700}.status.ok{background:#ecfdf3;color:#067647}@media(max-width:520px){.inv-fields{grid-template-columns:1fr}.inv-top h1{font-size:24px}}
</style>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="./profile.js?v=20260905-2"></script>
</head>
<body>
<main class="inv-page">
  <div class="inv-top">
    <button class="back" type="button" onclick="location.href='./'">‹</button>
    <div><h1>Inventario</h1><p>Escribe lo que tienes físicamente hoy.</p></div>
  </div>
  <div id="status" class="status">Cargando inventario…</div>
  <div id="inventoryForm"></div>
</main>
<div class="savebar"><button id="saveAll" class="primary" type="button">Guardar inventario</button></div>
<script>
window.addEventListener('DOMContentLoaded', async()=>{
  const PROFILE=window.PANEL_PROFILE||{};
  const ITEMS=PROFILE.items||{};
  const GROUPS=PROFILE.groups||{general:'Productos'};
  const defaults={containerHalf:5,containerLb:5,lidCeviche:5,container12:5,lid12:5,spoon:5,napkins:5};
  const firebaseConfig={apiKey:'AIzaSyBbOIXTr2Tvz1FvoTk5GZgP2jx24jpjlL4',authDomain:'ceviches-y-cocteles-el-chava.firebaseapp.com',projectId:'ceviches-y-cocteles-el-chava',storageBucket:'ceviches-y-cocteles-el-chava.firebasestorage.app',messagingSenderId:'227568387475',appId:'1:227568387475:web:6ccd3e67e62d1bf4b0d466',measurementId:'G-1MZS4J9Y4Z'};
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  const db=firebase.firestore();
  db.settings({experimentalForceLongPolling:true,useFetchStreams:false});
  const ref=db.collection('inventario').doc(PROFILE.inventoryDoc||`panel-${PROFILE.id}`);
  const status=document.getElementById('status');
  const form=document.getElementById('inventoryForm');
  const save=document.getElementById('saveAll');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const n=v=>Math.max(0,Number(v||0));
  try{
    let snap=await ref.get();
    let data=snap.exists?snap.data():{};
    if(!data.inventoryRealStart20260905){
      const zeroItems={}; Object.keys(ITEMS).forEach(k=>zeroItems[k]=0);
      await ref.set({items:zeroItems,inventoryRealStart20260905:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      data={...data,items:zeroItems};
    }
    const minimums=data.stockMinimums||{};
    const items=data.items||{};
    form.innerHTML=Object.entries(GROUPS).map(([g,label])=>{
      const rows=Object.entries(ITEMS).filter(([,x])=>x.group===g).map(([k,x])=>{
        const unit=x.unit||x.purchaseUnit||'';
        const min=Object.prototype.hasOwnProperty.call(minimums,k)?n(minimums[k]):n(defaults[k]||0);
        return `<div class="inv-row"><div class="inv-name">${esc(x.name)}</div><div class="inv-fields"><label>Cantidad disponible<input data-qty="${esc(k)}" type="number" min="0" step="0.01" value="${n(items[k])}"><div class="inv-unit">${esc(unit)}</div></label><label>Stock mínimo<input data-min="${esc(k)}" type="number" min="0" step="0.01" value="${min}"><div class="inv-unit">${esc(unit)}</div></label></div></div>`;
      }).join('');
      return rows?`<div class="inv-group">${esc(label)}</div>${rows}`:'';
    }).join('');
    status.textContent='Listo para capturar tu inventario real.';
    status.classList.add('ok');
  }catch(err){console.error(err);status.textContent='No pude cargar el inventario.';save.disabled=true;}
  save.addEventListener('click',async()=>{
    const items={},stockMinimums={};
    document.querySelectorAll('[data-qty]').forEach(i=>items[i.dataset.qty]=n(i.value));
    document.querySelectorAll('[data-min]').forEach(i=>stockMinimums[i.dataset.min]=n(i.value));
    save.disabled=true;save.textContent='Guardando…';
    try{
      await ref.set({items,stockMinimums,inventoryRealStart20260905:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      status.textContent='Inventario guardado.';status.classList.add('ok');
      save.textContent='Guardado ✓';
      setTimeout(()=>save.textContent='Guardar inventario',1200);
    }catch(err){console.error(err);alert('No se pudo guardar el inventario.');save.textContent='Guardar inventario';}
    finally{save.disabled=false;}
  });
});
</script>
</body>
</html>
