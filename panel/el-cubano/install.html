<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b7a43"><title>Instalar Panel El Cubano</title><link rel="manifest" href="./install.webmanifest"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff8e9;color:#143b2a;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}.card{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 34px #0002;text-align:center}.icon{width:112px;height:112px;border-radius:24px;margin-bottom:12px}h1{font-size:28px;margin:8px 0}p{font-size:17px;line-height:1.45}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:16px;padding:16px 18px;font-size:18px;font-weight:800;margin-top:14px;text-decoration:none}.install{background:#0b7a43;color:white}.open{background:#ffd21d;color:#143b2a}.status{font-weight:700;min-height:24px}</style></head><body><main class="card"><img class="icon" src="./pwa-icon-192.svg" alt="Panel El Cubano"><h1>Panel El Cubano</h1><p>Instálalo como app en tu teléfono para abrirlo directo desde tu pantalla principal.</p><p class="status" id="status">Preparando instalación…</p><button class="btn install" id="installBtn" hidden>Instalar app</button><a class="btn open" href="./">Abrir panel</a></main><script>let deferredPrompt=null;const btn=document.getElementById('installBtn'),status=document.getElementById('status');if(window.matchMedia('(display-mode: standalone)').matches){status.textContent='✅ Ya está instalado.';}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.hidden=false;status.textContent='Listo para instalar.';});btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;status.textContent=choice.outcome==='accepted'?'✅ Instalación aceptada.':'Instalación cancelada.';deferredPrompt=null;btn.hidden=true;});window.addEventListener('appinstalled',()=>{status.textContent='✅ App instalada.';btn.hidden=true;});if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});await navigator.serviceWorker.ready;if(!deferredPrompt&&!window.matchMedia('(display-mode: standalone)').matches){setTimeout(()=>{if(!deferredPrompt)status.textContent='Si no aparece el botón, abre el menú ⋮ de Chrome y toca “Instalar app”.';},1200);}}catch{status.textContent='No se pudo preparar la instalación.';}});}</script></body></html>
