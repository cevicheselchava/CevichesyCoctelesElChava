<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b7a43"><title>Instalar El Cubano Panel</title><link rel="manifest" href="./install.webmanifest"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff8e9;color:#143b2a;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}.card{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 34px #0002;text-align:center}.icon{width:112px;height:112px;border-radius:24px;margin-bottom:12px}h1{font-size:28px;margin:8px 0}p{font-size:17px;line-height:1.45}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:16px;padding:16px 18px;font-size:18px;font-weight:800;margin-top:14px;text-decoration:none}.install{background:#0b7a43;color:white}.chrome{background:#143b2a;color:white}.open{background:#ffd21d;color:#143b2a}.status{font-weight:700;min-height:24px}</style></head><body><main class="card"><img class="icon" src="./pwa-icon-192.svg" alt="El Cubano Panel"><h1>El Cubano Panel</h1><p>Esta es la app nueva del panel operativo.</p><p class="status" id="status">Preparando instalación…</p><button class="btn install" id="installBtn" hidden>Instalar app nueva</button><a class="btn chrome" id="chromeBtn" hidden href="intent://ceviches-y-cocteles-el-chava.web.app/panel/el-cubano/install.html#Intent;scheme=https;package=com.android.chrome;end">Abrir en Chrome para instalar</a><a class="btn open" href="./">Abrir panel nuevo</a></main><script>let deferredPrompt=null;const btn=document.getElementById('installBtn'),status=document.getElementById('status'),chromeBtn=document.getElementById('chromeBtn');const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;if(standalone){status.textContent='Estás dentro de una app instalada. Abre este instalador en Chrome para instalar El Cubano Panel.';chromeBtn.hidden=false;}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.hidden=false;chromeBtn.hidden=true;status.textContent='Listo para instalar El Cubano Panel.';});btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;status.textContent=choice.outcome==='accepted'?'✅ Instalación aceptada.':'Instalación cancelada.';deferredPrompt=null;btn.hidden=true;});window.addEventListener('appinstalled',()=>{status.textContent='✅ El Cubano Panel quedó instalado.';btn.hidden=true;chromeBtn.hidden=true;});if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});await navigator.serviceWorker.ready;if(!deferredPrompt&&!standalone){setTimeout(()=>{if(!deferredPrompt)status.textContent='En Chrome abre el menú ⋮ y toca “Instalar app”.';},1200);}}catch{status.textContent='No se pudo preparar la instalación.';}});}</script></body></html>
