name: Aplicar inventario agrupado
on:
  push:
    branches: [main]
    paths: [".github/workflows/aplicar-inventario.yml"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar mejoras al control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('control.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="control-extra.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar el cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control.html
          git diff --cached --quiet || git commit -m "Activar inventario agrupado en el control"
          git push
      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CEVICHES_Y_COCTELES_EL_CHAVA }}
          channelId: live
          projectId: ceviches-y-cocteles-el-chava
