name: Patch preparation recipes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Load preparation recipes script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load restored recipes UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('panel/el-cubano/index.html')
          s = p.read_text()
          old = '<script defer src="../purchase-entry-fix.js?v=20260905-1"></script>'
          new = old + '<script defer src="../preparation-recipes-restore.js?v=20260905-1"></script>'
          if 'preparation-recipes-restore.js' not in s:
              if old not in s:
                  raise SystemExit('purchase script marker not found')
              s = s.replace(old, new, 1)
              p.write_text(s)

          sw = Path('panel/el-cubano/service-worker.js')
          t = sw.read_text()
          t = t.replace("const CACHE='panel-el-cubano-v5'", "const CACHE='panel-el-cubano-v6'")
          purchase = "'/panel/purchase-entry-fix.js?v=20260905-1'"
          recipes = "'/panel/preparation-recipes-restore.js?v=20260905-1'"
          if recipes not in t and purchase in t:
              t = t.replace(purchase, purchase + ',' + recipes, 1)
          sw.write_text(t)
          PY
      - name: Commit panel fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/el-cubano/index.html panel/el-cubano/service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore preparation recipes in panel"
          git push origin main
