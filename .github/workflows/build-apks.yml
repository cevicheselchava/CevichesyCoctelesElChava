name: Compilar APKs Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Crear proyecto Android
        shell: bash
        run: |
          set -e
          rm -rf android-apks
          mkdir -p android-apks
          cd android-apks

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ElChavaApps'
          include ':pedidos', ':control'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          create_app() {
            MODULE="$1"
            PACKAGE="$2"
            APP_NAME="$3"
            START_URL="$4"

            mkdir -p "$MODULE/src/main/java/${PACKAGE//.//}"
            mkdir -p "$MODULE/src/main/res/values"
            mkdir -p "$MODULE/src/main/res/drawable"

            cat > "$MODULE/build.gradle" <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE'
              compileSdk 35

              defaultConfig {
                  applicationId '$PACKAGE'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

            : > "$MODULE/proguard-rules.pro"

            cat > "$MODULE/src/main/AndroidManifest.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/logo"
                  android:roundIcon="@drawable/logo"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ElChava"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

            cat > "$MODULE/src/main/res/values/strings.xml" <<EOF
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF

            cat > "$MODULE/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="Theme.ElChava" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#22983A</item>
                  <item name="android:statusBarColor">#06254D</item>
                  <item name="android:navigationBarColor">#06254D</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

            cp "$GITHUB_WORKSPACE/logo.png" "$MODULE/src/main/res/drawable/logo.png"

            cat > "$MODULE/src/main/java/${PACKAGE//.//}/MainActivity.java" <<EOF
          package $PACKAGE;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String START_URL = "$START_URL";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setSupportZoom(false);
                  settings.setUserAgentString(settings.getUserAgentString() + " ElChavaAndroid/1.0");

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return openExternalIfNeeded(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return openExternalIfNeeded(url);
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          if (request.isForMainFrame()) {
                              Toast.makeText(MainActivity.this,
                                  "No se pudo cargar. Revisa tu conexión a internet.",
                                  Toast.LENGTH_LONG).show();
                          }
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl(START_URL);
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              private boolean openExternalIfNeeded(String url) {
                  Uri uri = Uri.parse(url);
                  String host = uri.getHost() == null ? "" : uri.getHost();
                  if ((url.startsWith("https://") || url.startsWith("http://"))
                      && (host.equals("ceviches-y-cocteles-el-chava.web.app")
                          || host.equals("ceviches-y-cocteles-el-chava.firebaseapp.com"))) {
                      return false;
                  }
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                      startActivity(intent);
                      return true;
                  } catch (Exception ex) {
                      Toast.makeText(this, "No se pudo abrir el enlace.", Toast.LENGTH_SHORT).show();
                      return true;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF
          }

          create_app pedidos com.elchava.pedidos "Ceviches y Cócteles El Chava" "https://ceviches-y-cocteles-el-chava.web.app/"
          create_app control com.elchava.control "Control de Inventario" "https://ceviches-y-cocteles-el-chava.web.app/control.html"

      - name: Compilar las dos APK
        working-directory: android-apks
        run: gradle --no-daemon :pedidos:assembleDebug :control:assembleDebug

      - name: Preparar archivos APK
        shell: bash
        run: |
          mkdir -p apks
          cp android-apks/pedidos/build/outputs/apk/debug/pedidos-debug.apk "apks/Ceviches-y-Cocteles-El-Chava.apk"
          cp android-apks/control/build/outputs/apk/debug/control-debug.apk "apks/Control-de-Inventario-El-Chava.apk"
          sha256sum apks/*.apk > apks/SHA256SUMS.txt

      - name: Guardar APK en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apks
          git commit -m "Generar APKs Android" || exit 0
          git push
