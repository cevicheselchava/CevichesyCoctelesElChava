name: Compilar Panel El Cubano v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-panel-v3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Crear proyecto Android del panel
        shell: bash
        run: |
          set -e
          rm -rf android-panel-v3
          mkdir -p android-panel-v3/app/src/main/java/com/cevichesycocteleselchava/panelv3
          mkdir -p android-panel-v3/app/src/main/res/values
          mkdir -p android-panel-v3/app/src/main/res/drawable

          cat > android-panel-v3/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'PanelElCubanoV3'
          include ':app'
          EOF

          cat > android-panel-v3/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android-panel-v3/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-panel-v3/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.cevichesycocteleselchava.panelv3'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.cevichesycocteleselchava.panelv3'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '3.0.0'
              }
          }
          EOF

          cat > android-panel-v3/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/logo"
                  android:roundIcon="@drawable/logo"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-panel-v3/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Panel El Cubano</string></resources>
          EOF

          cat > android-panel-v3/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#0b7a43</item>
                  <item name="android:statusBarColor">#0b7a43</item>
                  <item name="android:navigationBarColor">#0b7a43</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cp logo.png android-panel-v3/app/src/main/res/drawable/logo.png

          cat > android-panel-v3/app/src/main/java/com/cevichesycocteleselchava/panelv3/MainActivity.java <<'EOF'
          package com.cevichesycocteleselchava.panelv3;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.SslErrorHandler;
          import android.net.http.SslError;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String START_URL = "https://ceviches-y-cocteles-el-chava.web.app/panel/el-cubano/";
              private WebView webView;
              private boolean pageFinished = false;
              private boolean openedFallback = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView.setWebContentsDebuggingEnabled(true);
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(-1, -1));
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadsImagesAutomatically(true);
                  s.setBlockNetworkLoads(false);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  webView.clearCache(true);
                  webView.clearHistory();

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          pageFinished = false;
                          Log.d("PanelWebView", "START " + url);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pageFinished = true;
                          Log.d("PanelWebView", "FINISH " + url);
                          view.evaluateJavascript(
                              "(function(){return (document.body&&document.body.innerText?document.body.innerText.length:0).toString();})()",
                              value -> Log.d("PanelWebView", "BODY_LEN=" + value)
                          );
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrl(url);
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          Log.e("PanelWebView", "ERROR " + error.getErrorCode() + " " + error.getDescription() + " " + request.getUrl());
                          if (request.isForMainFrame()) openInBrowser();
                      }

                      @Override
                      public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse response) {
                          super.onReceivedHttpError(view, request, response);
                          Log.e("PanelWebView", "HTTP " + response.getStatusCode() + " " + request.getUrl());
                          if (request.isForMainFrame() && response.getStatusCode() >= 400) openInBrowser();
                      }

                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.cancel();
                          Log.e("PanelWebView", "SSL " + error);
                          openInBrowser();
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl(START_URL);
                  } else {
                      webView.restoreState(savedInstanceState);
                  }

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if (openedFallback) return;
                      webView.evaluateJavascript(
                          "(function(){return (document.body&&document.body.innerText?document.body.innerText.length:0);})()",
                          value -> {
                              try {
                                  String clean = value == null ? "0" : value.replace("\"", "");
                                  int len = Integer.parseInt(clean);
                                  if (!pageFinished || len < 20) openInBrowser();
                              } catch (Exception e) {
                                  openInBrowser();
                              }
                          }
                      );
                  }, 7000);
              }

              private boolean handleUrl(String url) {
                  Uri uri = Uri.parse(url);
                  String host = uri.getHost() == null ? "" : uri.getHost();
                  if ((url.startsWith("https://") || url.startsWith("http://")) &&
                      (host.equals("ceviches-y-cocteles-el-chava.web.app") ||
                       host.equals("ceviches-y-cocteles-el-chava.firebaseapp.com"))) {
                      return false;
                  }
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (Exception e) {
                      Toast.makeText(this, "No se pudo abrir el enlace", Toast.LENGTH_SHORT).show();
                  }
                  return true;
              }

              private void openInBrowser() {
                  if (openedFallback) return;
                  openedFallback = true;
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(START_URL)));
                  } catch (Exception e) {
                      Toast.makeText(this, "No se pudo abrir el panel", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Compilar APK
        working-directory: android-panel-v3
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        shell: bash
        run: |
          set -e
          mkdir -p apks
          cp android-panel-v3/app/build/outputs/apk/debug/app-debug.apk apks/Panel-El-Cubano-v3.apk
          sha256sum apks/Panel-El-Cubano-v3.apk > apks/Panel-El-Cubano-v3.sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apks/Panel-El-Cubano-v3.apk apks/Panel-El-Cubano-v3.sha256.txt
          git commit -m "Generar Panel El Cubano v3" || exit 0
          git push
