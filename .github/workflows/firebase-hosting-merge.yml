# Despliega únicamente la app y el panel en Firebase Hosting
name: Deploy to Firebase Hosting on merge
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar app, PWA y panel administrativo
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ.get('GITHUB_SHA', 'v12')[:12]

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'\n?<script src="order-fix\.js(?:\?[^\"]*)?"></script>', '', html)
          html = re.sub(r'\n?<script src="promo-personal\.js(?:\?[^\"]*)?"></script>', '', html)
          html = re.sub(r'\n?<script src="instant-order\.js(?:\?[^\"]*)?"></script>', '', html)
          html = re.sub(r'\n?<script src="customer-theme\.js(?:\?[^\"]*)?"></script>', '', html)
          html = re.sub(r'\n?<script src="customer-buttons\.js(?:\?[^\"]*)?"></script>', '', html)
          html = re.sub(r'\n?<script src="customer-nav\.js(?:\?[^\"]*)?"></script>', '', html)
          html = re.sub(r'\n?<script src="pwa-init\.js(?:\?[^\"]*)?"></script>', '', html)
          html = re.sub(r'\n?<style id="mobile-qty-fix">.*?</style>', '', html, flags=re.S)
          html = re.sub(r'<title>.*?</title>', '<title>Ceviches y Cócteles El Cubano</title>', html, count=1)

          pwa_head = (
              '<meta name="description" content="Ordena ceviches y cócteles El Cubano con entrega a domicilio.">\n'
              '<meta name="mobile-web-app-capable" content="yes">\n'
              '<meta name="apple-mobile-web-app-capable" content="yes">\n'
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n'
              '<meta name="apple-mobile-web-app-title" content="El Cubano">\n'
              '<link rel="manifest" href="/manifest.webmanifest">\n'
              f'<link rel="icon" href="/pwa-icon.svg?v={version}" type="image/svg+xml">\n'
              f'<link rel="apple-touch-icon" href="/pwa-icon.svg?v={version}">'
          )
          if 'rel="manifest"' not in html:
              html = html.replace('</head>', pwa_head + '\n</head>', 1)

          html = html.replace(
              '</body>',
              f'<script src="instant-order.js?v={version}"></script>\n'
              f'<script src="promo-personal.js?v={version}"></script>\n'
              f'<script src="order-fix.js?v={version}"></script>\n'
              f'<script src="customer-theme.js?v={version}"></script>\n'
              f'<script src="customer-nav.js?v={version}"></script>\n'
              f'<script src="pwa-init.js?v={version}"></script>\n'
              '</body>',
              1
          )
          index.write_text(html, encoding='utf-8')

          control = Path('control.html')
          panel = control.read_text(encoding='utf-8')
          panel = re.sub(
              r"const db=firebase\.firestore\(\)(?:;db\.settings\(\{experimentalForceLongPolling:true,useFetchStreams:false\}\))?;const inventoryRef",
              "const db=firebase.firestore();db.settings({experimentalForceLongPolling:true,useFetchStreams:false});const inventoryRef",
              panel,
              count=1
          )
          panel = re.sub(r'<title>.*?</title>', '<title>Panel Operativo El Cubano</title>', panel, count=1)
          panel = panel.replace(
              '<meta name="theme-color" content="#06254d">',
              '<meta name="theme-color" content="#267642">\n'
              '<meta name="mobile-web-app-capable" content="yes">\n'
              '<meta name="apple-mobile-web-app-capable" content="yes">\n'
              '<meta name="apple-mobile-web-app-title" content="Panel El Cubano">\n'
              '<link rel="manifest" href="/control-manifest.webmanifest">\n'
              f'<link rel="apple-touch-icon" href="/pwa-icon.svg?v={version}">',
              1
          )
          panel = panel.replace('<h1>Control de Inventario</h1>', '<h1>Panel Operativo <span>El Cubano</span></h1>', 1)
          panel = re.sub(r'\n?<script src="control-fix\.js(?:\?[^\"]*)?"></script>', '', panel)
          panel = re.sub(r'\n?<script src="control-theme\.js(?:\?[^\"]*)?"></script>', '', panel)
          panel = re.sub(r'\n?<script src="pwa-init\.js(?:\?[^\"]*)?"></script>', '', panel)
          panel = re.sub(
              r'<div class="footer">.*?</div>',
              '<div class="footer">Panel Operativo El Cubano · v10</div>',
              panel,
              count=1
          )
          panel = panel.replace(
              '</body>',
              f'<script src="control-fix.js?v={version}"></script>\n'
              f'<script src="control-theme.js?v={version}"></script>\n'
              f'<script src="pwa-init.js?v={version}"></script>\n'
              '</body>',
              1
          )
          control.write_text(panel, encoding='utf-8')
          PY

      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CEVICHES_Y_COCTELES_EL_CHAVA }}
          channelId: live
          projectId: ceviches-y-cocteles-el-chava
