            if(constructor&&typeof addRecipes==='function'&&typeof fish1!=='undefined')constructor.recipe=addRecipes(fish1,cocktail12Recipe);
            const hambre=setProduct('promo_hambre',{detail:'1 libra de ceviche de camarón + 1 cóctel de camarón 12 oz',price:27,cost:8.66,promo:'Ahorras $3',inventoryNote:''});
