          Path('promo-personal.js').write_text(clean_promo, encoding='utf-8')

          # Pedido funcional: sin estilos, observers ni setTimeouts de UI.
          clean_order = r'''(()=>{
            'use strict';
            const dateInput=document.getElementById('date');
            function localDateString(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
            function firstAvailableDate(){const tomorrow=new Date();tomorrow.setHours(12,0,0,0);tomorrow.setDate(tomorrow.getDate()+1);return localDateString(tomorrow)}
            function dayAheadMessage(){return document.documentElement.lang==='en'?'To maintain quality and freshness, we only accept orders at least one day in advance.':'Para mantener la calidad y frescura de nuestros productos, solo recibimos pedidos de un día para otro.'}
            if(dateInput){dateInput.min=firstAvailableDate();if(dateInput.value&&dateInput.value<dateInput.min)dateInput.value=''}
            document.addEventListener('change',event=>{const input=event.target.closest?.('#date');if(!input)return;input.min=firstAvailableDate();if(input.value&&input.value<input.min){input.value='';alert(dayAheadMessage())}},true);

            const sendButton=document.getElementById('continueOrder');
            const modal=document.getElementById('cartModal');
            function hideCart(event){if(event){event.preventDefault();event.stopPropagation()}if(modal)modal.hidden=true;document.body.classList.remove('modal-open')}
            window.closeCart=hideCart;
            [document.getElementById('closeCart'),document.getElementById('cartBackdrop'),document.getElementById('keepShopping')].forEach(element=>element?.addEventListener('click',hideCart,true));
            if(!sendButton||typeof validateOrder!=='function'||typeof buildOrder!=='function'||typeof buildWhatsApp!=='function')return;

            const PROJECT_ID='ceviches-y-cocteles-el-chava';
            const API_KEY='AIzaSyBbOIXTr2Tvz1FvoTk5GZgP2jx24jpjlL4';
            let pendingOrderId=sessionStorage.getItem('pendingOrderId')||'';
            function newOrderId(){if(pendingOrderId)return pendingOrderId;pendingOrderId='PED-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,7).toUpperCase();sessionStorage.setItem('pendingOrderId',pendingOrderId);return pendingOrderId}
            function toFirestoreValue(value){if(value===null)return{nullValue:null};if(value instanceof Date)return{timestampValue:value.toISOString()};if(Array.isArray(value))return{arrayValue:{values:value.map(toFirestoreValue)}};if(typeof value==='boolean')return{booleanValue:value};if(typeof value==='number')return Number.isInteger(value)?{integerValue:String(value)}:{doubleValue:value};if(typeof value==='string')return{stringValue:value};if(typeof value==='object')return{mapValue:{fields:toFirestoreFields(value)}};return{stringValue:String(value)}}
            function toFirestoreFields(object){const fields={};Object.entries(object||{}).forEach(([key,value])=>{if(value!==undefined)fields[key]=toFirestoreValue(value)});return fields}
            async function saveWithRest(order,id){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);const url=`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/pedidos/${encodeURIComponent(id)}?key=${encodeURIComponent(API_KEY)}`;try{const response=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:toFirestoreFields(order)}),signal:controller.signal,cache:'no-store'});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result?.error?.message||`Firebase respondió ${response.status}`);return result}finally{clearTimeout(timer)}}
            function openWhatsApp(order,id){hideCart();window.location.href='https://wa.me/12109432119?text='+encodeURIComponent(buildWhatsApp(order,id))}
            sendButton.onclick=async()=>{
              if(!dateInput?.value||dateInput.value<firstAvailableDate()){hideCart();dateInput?.scrollIntoView({behavior:'auto',block:'center'});alert(dayAheadMessage());return}
              if(!validateOrder())return;
              sendButton.disabled=true;sendButton.textContent='Enviando pedido...';
              const id=newOrderId();const order={...buildOrder(),id,createdAt:new Date(),createdAtClient:new Date().toISOString()};
              try{await saveWithRest(order,id);sessionStorage.removeItem('pendingOrderId');pendingOrderId='';openWhatsApp(order,id)}catch(error){console.error('No se pudo sincronizar el pedido con Firestore:',error);sessionStorage.removeItem('pendingOrderId');pendingOrderId='';openWhatsApp(order,id)}finally{sendButton.disabled=false;sendButton.textContent='Enviar pedido'}
            };
          })();'''
          Path('order-fix.js').write_text(clean_order, encoding='utf-8')

          # Runtime pequeño: PWA + idioma. No cambia layout ni añade hojas visuales.
          customer_runtime = r'''(()=>{
            'use strict';
            if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(console.error));
            const STORAGE_KEY='el-cubano-language';
            let language=localStorage.getItem(STORAGE_KEY)||'es';
            const exact=new Map([
              ['Ceviches & Cócteles','Ceviches & Seafood Cocktails'],['Fresco · preparado al momento','Fresh · made to order'],['🥣 Ceviche real, preparado fresco','🥣 Real ceviche, freshly prepared'],['Hecho al momento · Sabor que sí se antoja','Made to order · Fresh flavor you’ll crave'],['¿Qué se te antoja hoy?','What are you craving today?'],['Programa tu pedido · Delivery gratis en área delimitada','Schedule your order · Free delivery within the service area'],['💯 Seguro','💯 Secure'],['Sin anticipos','No prepayment'],['💵 Paga al recibir','💵 Pay on delivery'],['Efectivo o Cash App','Cash or Cash App'],['🚚 Delivery','🚚 Delivery'],['Área delimitada','Service area'],['Promociones','Promotions'],['Ceviches','Ceviches'],['Cócteles','Cocktails'],['Sobre pedido','Preorder'],['Refrescos','Sodas'],['Datos de entrega','Delivery details'],['Día de entrega','Delivery date'],['Hora de entrega','Delivery time'],['Selecciona un horario','Select a time'],['Tu carrito','Your cart'],['Seguir comprando','Keep shopping'],['Enviar pedido','Send order'],['Agrega productos','Add products'],['Ver carrito y continuar','View cart and continue'],['Revisar antes de enviar','Review before sending'],['Precio pendiente','Price pending'],['por presentación','per serving'],['📅 Pedido con anticipación. Para mantener la calidad y frescura de nuestros productos, solo recibimos pedidos de un día para otro. Gracias por tu comprensión.','📅 Order ahead. To maintain quality and freshness, we only accept orders at least one day in advance. Thank you for understanding.']
            ]);
            function translateString(text){const trimmed=text.trim();if(!trimmed)return text;if(exact.has(trimmed))return text.replace(trimmed,exact.get(trimmed));return text.replace(/Ahorras\s*\$([0-9.]+)/gi,'Save $$$1').replace(/ceviche de pescado/gi,'fish ceviche').replace(/ceviche de camarón/gi,'shrimp ceviche').replace(/ceviche mixto/gi,'mixed ceviche').replace(/pulpo y pescado/gi,'octopus & fish').replace(/pulpo y camarón/gi,'octopus & shrimp').replace(/refresco/gi,'soda').replace(/½ libra/gi,'½ lb').replace(/1 libra/gi,'1 lb')}
            function applyLanguage(){document.documentElement.lang=language==='en'?'en':'es';const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{if(node.parentElement?.closest('script,style,#language-switch'))return;if(node.__esText===undefined)node.__esText=node.nodeValue;node.nodeValue=language==='en'?translateString(node.__esText):node.__esText});document.querySelectorAll('#language-switch button').forEach(button=>button.classList.toggle('active',button.dataset.lang===language))}
            document.getElementById('language-switch')?.addEventListener('click',event=>{const button=event.target.closest('button[data-lang]');if(!button)return;language=button.dataset.lang;localStorage.setItem(STORAGE_KEY,language);applyLanguage()});
            applyLanguage();
          })();'''
          Path('customer-runtime.js').write_text(customer_runtime, encoding='utf-8')

          # Service worker: navegación y JS siempre frescos; sin mostrar HTML viejo primero.
          service_worker = r'''const CACHE_NAME='el-cubano-pwa-v4';
          const STATIC_SHELL=['/manifest.webmanifest','/pwa-icon.svg'];
          self.addEventListener('install',event=>event.waitUntil((async()=>{const cache=await caches.open(CACHE_NAME);await Promise.allSettled(STATIC_SHELL.map(url=>cache.add(new Request(url,{cache:'reload'}))));await self.skipWaiting()})()));
          self.addEventListener('activate',event=>event.waitUntil((async()=>{const keys=await caches.keys();await Promise.all(keys.filter(key=>key!==CACHE_NAME).map(key=>caches.delete(key)));await self.clients.claim()})()));
          async function fresh(request){return fetch(new Request(request,{cache:'no-store'}))}
          async function networkFirst(request){const cache=await caches.open(CACHE_NAME);try{const response=await fresh(request);if(response?.ok)await cache.put(request,response.clone());return response}catch(error){const cached=await caches.match(request);if(cached)return cached;throw error}}
          self.addEventListener('fetch',event=>{const request=event.request;if(request.method!=='GET')return;const url=new URL(request.url);if(url.origin!==self.location.origin)return;if(request.mode==='navigate'||url.pathname==='/'||url.pathname==='/index.html'){event.respondWith(fresh(request));return}if(url.pathname.endsWith('.js')||url.pathname.endsWith('.css')||url.pathname==='/control.html'){event.respondWith(networkFirst(request));return}});'''
          Path('service-worker.js').write_text(service_worker, encoding='utf-8')

          # Scripts del cliente: solo datos/pedido/runtime. Ninguno rediseña la app.
          html = html.replace(
              '</body>',
              f'<script src="promo-personal.js?v={version}"></script>\n'
              f'<script src="order-fix.js?v={version}"></script>\n'
              + behavior + '\n'
              + f'<script src="customer-runtime.js?v={version}"></script>\n'
              + '</body>',
              1
          )
          index.write_text(html, encoding='utf-8')

          # ---------- PANEL OPERATIVO: conservar funcionamiento actual ----------
          control = Path('control.html')
          panel = control.read_text(encoding='utf-8')
          panel = re.sub(
              r"const db=firebase\.firestore\(\)(?:;db\.settings\(\{experimentalForceLongPolling:true,useFetchStreams:false\}\))?;const inventoryRef",
              "const db=firebase.firestore();db.settings({experimentalForceLongPolling:true,useFetchStreams:false});const inventoryRef",
              panel, count=1
          )
          panel = re.sub(r'<title>.*?</title>', '<title>Panel Operativo El Cubano</title>', panel, count=1)
          panel = panel.replace('<h1>Control de Inventario</h1>', '<h1>Panel Operativo <span>El Cubano</span></h1>', 1)
          for script_name in ['control-fix.js','control-theme.js','pwa-init.js']:
              panel = re.sub(rf'\n?<script src="{re.escape(script_name)}(?:\?[^\"]*)?"></script>', '', panel)
          panel = re.sub(r'<div class="footer">.*?</div>', '<div class="footer">Panel Operativo El Cubano · v10</div>', panel, count=1)
          panel = panel.replace(
              '</body>',
              f'<script src="control-fix.js?v={version}"></script>\n'
              f'<script src="control-theme.js?v={version}"></script>\n'
              f'<script src="pwa-init.js?v={version}"></script>\n'
              '</body>', 1
          )
          control.write_text(panel, encoding='utf-8')
          PY

