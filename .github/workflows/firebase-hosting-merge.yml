# Despliega la app y el panel en Firebase Hosting
name: Deploy to Firebase Hosting on merge
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar app y panel
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from collections import deque
          from PIL import Image
          import base64
          import io
          import os
          import re

          version = os.environ.get('GITHUB_SHA', 'final')[:12]

          # ---------- APP DE PEDIDOS: HTML FINAL ANTES DEL PRIMER PINTADO ----------
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          # Quitar cualquier capa/parche viejo del HTML fuente.
          for script_name in [
              'order-fix.js', 'promo-personal.js', 'instant-order.js',
              'customer-theme.js', 'customer-buttons.js', 'customer-nav.js',
              'approved-ui.js', 'layout-fix.js', 'pwa-init.js', 'customer-runtime.js'
          ]:
              html = re.sub(
                  rf'\n?<script[^>]+src="/?{re.escape(script_name)}(?:\?[^\"]*)?"[^>]*></script>',
                  '', html
              )
          html = re.sub(r'\n?<style id="mobile-qty-fix">.*?</style>', '', html, flags=re.S)
          html = re.sub(r'\n?<style id="el-cubano-final-ui">.*?</style>', '', html, flags=re.S)
          html = re.sub(r'\n?<style id="customer-priority-ui-20260831">.*?</style>', '', html, flags=re.S)
          html = re.sub(r'<title>.*?</title>', '<title>Ceviches y Cócteles El Cubano</title>', html, count=1)
          html = re.sub(
              r'<meta name="theme-color" content="[^"]+">',
              '<meta name="theme-color" content="#1f6f3b">',
              html,
              count=1
          )

          # Logo transparente.
          icon_svg = Path('pwa-icon.svg').read_text(encoding='utf-8')
          logo_match = re.search(r'data:image/jpeg;base64,([^\"]+)', icon_svg)
          if logo_match:
              logo = Image.open(io.BytesIO(base64.b64decode(logo_match.group(1)))).convert('RGBA')
              px = logo.load()
              w, h = logo.size
              seen = set()
              q = deque()

              def is_bg(x, y):
                  r, g, b, a = px[x, y]
                  return a > 0 and r >= 232 and g >= 232 and b >= 232

              for x in range(w):
                  if is_bg(x, 0): q.append((x, 0))
                  if is_bg(x, h - 1): q.append((x, h - 1))
              for y in range(h):
                  if is_bg(0, y): q.append((0, y))
                  if is_bg(w - 1, y): q.append((w - 1, y))

              while q:
                  x, y = q.popleft()
                  if (x, y) in seen or not is_bg(x, y):
                      continue
                  seen.add((x, y))
                  r, g, b, a = px[x, y]
                  px[x, y] = (r, g, b, 0)
                  if x > 0: q.append((x - 1, y))
                  if x + 1 < w: q.append((x + 1, y))
                  if y > 0: q.append((x, y - 1))
                  if y + 1 < h: q.append((x, y + 1))

              bbox = logo.getchannel('A').getbbox()
              if bbox:
                  logo = logo.crop(bbox)
              logo.save('el-cubano-logo-transparent.png', 'PNG', optimize=True)

          # PWA metadata.
          if 'rel="manifest"' not in html:
              pwa = (
                  '<meta name="description" content="Ordena ceviches y cócteles El Cubano con entrega a domicilio.">\n'
                  '<meta name="mobile-web-app-capable" content="yes">\n'
                  '<meta name="apple-mobile-web-app-capable" content="yes">\n'
                  '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n'
                  '<meta name="apple-mobile-web-app-title" content="El Cubano">\n'
                  '<link rel="manifest" href="/manifest.webmanifest">\n'
                  f'<link rel="icon" href="/pwa-icon.svg?v={version}" type="image/svg+xml">'
              )
              html = html.replace('</head>', pwa + '\n</head>', 1)

          # UNA sola hoja visual. Se entrega en el HTML; no aparece después con JavaScript.
          final_css = r'''
          :root{
            --navy:#14365b;--green:#237443;--yellow:#f3bd2f;--red:#d94638;
            --cream:#fff9ed;--ink:#18304f;--muted:#69778b;--line:#e6dccb;
          }
          html{background:var(--cream)!important;scroll-behavior:auto!important}
          body{
            position:relative!important;min-height:100vh!important;color:var(--ink)!important;
            padding-bottom:86px!important;background:linear-gradient(155deg,#fffdf8 0%,#fff7e6 52%,#fffdf8 100%)!important;
          }
          body::before{
            content:""!important;position:absolute!important;inset:0!important;z-index:0!important;pointer-events:none!important;
            background:url('/el-cubano-logo-transparent.png') center 64%/min(70vw,450px) auto no-repeat!important;
            opacity:.075!important;
          }
          body::after{display:none!important}
          .wrap{position:relative!important;z-index:1!important;max-width:980px!important;padding:10px!important}

          #language-switch{display:flex;align-items:center;gap:5px;margin:2px 3px 8px;position:relative;z-index:4}
          #language-switch button{border:0;background:transparent;color:var(--navy);font-weight:900;font-size:15px;padding:7px 9px;border-radius:11px}
          #language-switch button.active{background:#fff;outline:1px solid var(--line)}
          #language-switch .divider{font-weight:900;color:#9a8d78}

          .hero{
            position:relative!important;overflow:hidden!important;text-align:center!important;
            padding:13px 13px 17px!important;border-radius:28px!important;
            background:rgba(255,255,255,.88)!important;border:1px solid rgba(226,216,199,.94)!important;
            box-shadow:0 6px 16px rgba(35,55,75,.07)!important;
            backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
          }
          .hero::before{display:none!important}
          .hero::after{
            content:""!important;position:absolute!important;left:0!important;right:0!important;bottom:0!important;height:6px!important;
            background:linear-gradient(90deg,var(--red) 0 33%,var(--yellow) 33% 66%,var(--green) 66%)!important;
          }
          .hero>*{position:relative;z-index:1}
          .customer-brand-row{display:block!important;min-height:0!important;padding:0!important;margin:0 auto 7px!important;text-align:center!important}
          .main-logo{
            display:block!important;width:min(205px,58vw)!important;height:auto!important;max-height:205px!important;
            object-fit:contain!important;margin:0 auto!important;padding:0!important;border-radius:0!important;
            background:transparent!important;box-shadow:none!important;filter:none!important;
          }
          .customer-brand-copy strong{display:block!important;color:#075d2b!important;font-size:32px!important;line-height:1.02!important;font-weight:1000!important}
          .customer-brand-copy span{display:block!important;margin-top:1px!important;color:#cf3024!important;font-family:Georgia,serif!important;font-size:44px!important;line-height:1!important;font-style:italic!important}
          .customer-brand-copy small{display:block!important;margin-top:7px!important;color:#6f5139!important;font-size:18px!important;line-height:1.15!important;font-weight:900!important}
          .customer-food-hero{position:relative!important;overflow:hidden!important;margin:10px 0 12px!important;border-radius:23px!important;background:#ece5d9!important;box-shadow:0 5px 13px rgba(23,49,68,.08)!important}
          .customer-food-hero img{display:block!important;width:100%!important;height:auto!important;min-height:250px!important;aspect-ratio:1.32/1!important;object-fit:cover!important;object-position:center 48%!important}
          .customer-food-copy{position:absolute!important;left:0!important;right:0!important;bottom:0!important;padding:30px 14px 12px!important;text-align:left!important;color:#fff!important;background:linear-gradient(180deg,transparent,rgba(8,20,24,.88))!important}
          .customer-food-copy strong{display:block!important;font-size:18px!important;line-height:1.15!important}
          .customer-food-copy span{display:block!important;margin-top:4px!important;font-size:14px!important;font-weight:900!important}
          .hero>h1{font-size:30px!important;margin:12px 0 4px!important;color:var(--navy)!important}
          .hero>p{font-size:16px!important;margin:0!important;color:#9d332d!important;font-weight:900!important}
          .cart-top{z-index:3!important;background:#fff!important;color:var(--green)!important;border:1px solid var(--line)!important;box-shadow:0 4px 10px rgba(24,55,70,.09)!important}
          .cart-badge{background:var(--red)!important}

          /* Información secundaria: compacta. */
          .benefits{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:7px!important;margin-top:13px!important}
          .benefit{position:relative!important;overflow:hidden!important;min-height:74px!important;padding:9px 6px 11px!important;border-radius:16px!important;background:#fff!important;border:1px solid var(--line)!important;box-shadow:0 2px 7px rgba(24,49,73,.04)!important;font-size:14px!important;line-height:1.12!important}
          .benefit b{display:block!important;margin-bottom:2px!important;font-size:16px!important;line-height:1.08!important}
          .benefit::after{content:""!important;position:absolute!important;left:22%!important;right:22%!important;bottom:0!important;height:4px!important;border-radius:99px!important}
          .benefit:nth-child(1)::after{background:var(--red)!important}.benefit:nth-child(2)::after{background:var(--yellow)!important}.benefit:nth-child(3)::after{background:var(--green)!important}
          .benefit:nth-child(1) b{color:var(--red)!important}.benefit:nth-child(2) b{color:#9a6a00!important}.benefit:nth-child(3) b{color:var(--green)!important}

          /* Navegación principal: 3 arriba, 2 abajo. */
          #customer-category-nav{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:9px!important;margin:14px 0 18px!important;padding:9px!important;background:rgba(255,255,255,.82)!important;border:1px solid var(--line)!important;border-radius:22px!important;box-shadow:0 4px 11px rgba(24,55,70,.05)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
          #customer-category-nav button[data-group]{position:relative!important;overflow:hidden!important;grid-column:span 2!important;min-width:0!important;min-height:108px!important;padding:11px 7px 13px!important;border:1px solid rgba(231,223,210,.95)!important;border-radius:18px!important;background:#fff!important;color:var(--navy)!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:7px!important;font-size:17px!important;line-height:1.08!important;font-weight:1000!important;box-shadow:0 3px 8px rgba(24,55,70,.04)!important;transition:none!important;animation:none!important}
          #customer-category-nav button[data-group]:nth-child(4),#customer-category-nav button[data-group]:nth-child(5){grid-column:span 3!important}
          #customer-category-nav button::after{content:""!important;position:absolute!important;left:13%!important;right:13%!important;bottom:0!important;height:4px!important;border-radius:9px!important;background:var(--green)!important}
          #customer-category-nav button:nth-child(1)::after{background:var(--red)!important}#customer-category-nav button:nth-child(2)::after{background:var(--yellow)!important}#customer-category-nav button:nth-child(3)::after{background:var(--green)!important}#customer-category-nav button:nth-child(4)::after{background:var(--red)!important}#customer-category-nav button:nth-child(5)::after{background:var(--yellow)!important}
          #customer-category-nav button:nth-child(1).active{background:linear-gradient(135deg,#d84a3c,#ee7163)!important;color:#fff!important}
          #customer-category-nav button:nth-child(2).active{background:linear-gradient(135deg,#efb82d,#f7cf61)!important}
          #customer-category-nav button:nth-child(3).active{background:linear-gradient(135deg,#287948,#49a56b)!important;color:#fff!important}
          #customer-category-nav button:nth-child(4).active{background:linear-gradient(135deg,#d84a3c,#ee7163)!important;color:#fff!important}
          #customer-category-nav button:nth-child(5).active{background:linear-gradient(135deg,#efb82d,#f7cf61)!important}
          #customer-category-nav .cat-icon{font-size:33px!important;line-height:1!important}
          #customer-category-nav .cat-label{display:block!important;max-width:100%!important;font-size:17px!important;line-height:1.08!important;font-weight:1000!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;text-align:center!important}

          .section[data-group]{margin-top:0!important}
          .section[data-group]>.section-title{display:none!important}
          .section[data-group]>.products{margin-top:0!important;transition:none!important}
          .section[data-group].open>.products{margin-top:9px!important}
          .product{background:rgba(255,255,255,.93)!important;border:1px solid rgba(226,218,204,.95)!important;border-radius:19px!important;box-shadow:0 3px 8px rgba(24,49,73,.04)!important;transition:none!important;animation:none!important}
          .promo-section .product{border-top:3px solid rgba(217,70,56,.62)!important}
          .promo-save{background:rgba(243,189,47,.23)!important;color:#745100!important}
          .qty button{transition:none!important;animation:none!important}

          #customer-info-after-menu{margin-top:12px!important}
          .notice,.availability-note{margin:10px 0!important;padding:11px 13px!important;border-radius:17px!important;background:rgba(255,255,255,.91)!important;border:1px solid var(--line)!important;box-shadow:0 2px 7px rgba(24,49,73,.035)!important;font-size:17px!important;line-height:1.3!important}
          .notice b{color:#a23b31!important}.availability-note{color:var(--navy)!important;border-left:5px solid var(--green)!important}
          .checkout{background:rgba(255,255,255,.94)!important;border:1px solid var(--line)!important;border-radius:22px!important;box-shadow:0 3px 9px rgba(25,48,80,.04)!important}
          input,select,textarea{background:#fff!important;border:1.5px solid #d9d2c5!important;border-radius:14px!important}

          /* Carrito: una sola regla, desde el primer pintado. */
          .sticky{position:fixed!important;z-index:40!important;left:auto!important;right:18px!important;bottom:18px!important;width:min(220px,calc(100vw - 36px))!important;max-width:calc(100vw - 36px)!important;min-height:54px!important;padding:5px 6px!important;display:flex!important;align-items:center!important;justify-content:center!important;border:0!important;border-radius:999px!important;background:linear-gradient(95deg,#0aa84b,#22cf67)!important;box-shadow:0 6px 14px rgba(5,92,42,.18)!important;overflow:hidden!important}
          .sticky::before{display:none!important}
          .sticky .summary{width:100%!important;flex:1 1 auto!important;min-width:0!important;padding:0!important;text-align:center!important}
          .sticky .summary b{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:5px!important;width:100%!important;white-space:nowrap!important;font-size:0!important}
          .sticky .summary b::before{content:'🛒 Ver pedido'!important;flex:1 1 auto!important;text-align:center!important;font-size:16px!important;font-weight:1000!important;line-height:1!important}
          .sticky .summary b span{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;min-width:58px!important;margin:0!important;padding:8px 7px!important;border-radius:999px!important;background:rgba(255,255,255,.20)!important;color:#fff!important;font-size:15px!important;line-height:1!important}
          .sticky .summary small{display:none!important}
          .sticky .send{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;padding:0!important;margin:0!important;opacity:0!important;z-index:3!important;border-radius:999px!important}
          body.modal-open .sticky{display:none!important}
          .cart-modal{z-index:1000!important}.cart-backdrop{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

          @media(min-width:701px){
            #customer-category-nav{grid-template-columns:repeat(5,minmax(0,1fr))!important}
            #customer-category-nav button[data-group],#customer-category-nav button[data-group]:nth-child(4),#customer-category-nav button[data-group]:nth-child(5){grid-column:auto!important;min-height:98px!important}
          }
          @media(max-width:430px){
            .customer-brand-copy strong{font-size:29px!important}.customer-brand-copy span{font-size:41px!important}.customer-brand-copy small{font-size:17px!important}
            .benefit{min-height:70px!important;font-size:13px!important}.benefit b{font-size:15px!important}
            #customer-category-nav{gap:8px!important;padding:8px!important}
            #customer-category-nav button[data-group]{min-height:104px!important;padding:10px 6px 12px!important}
            #customer-category-nav .cat-icon{font-size:31px!important}#customer-category-nav .cat-label{font-size:16px!important}
            .sticky{right:16px!important;bottom:18px!important;width:min(216px,calc(100vw - 32px))!important;max-width:calc(100vw - 32px)!important}
            .sticky .summary b::before{font-size:15px!important}.sticky .summary b span{font-size:14px!important;min-width:56px!important;padding:8px 6px!important}
          }
          '''
          html = html.replace('</head>', f'<style id="el-cubano-final-ui">{final_css}</style>\n</head>', 1)

          # Hero final.
          hero = f'''<header class="hero">
            <button class="cart-top" id="cartTop" type="button" aria-label="Ir al carrito">🛒<span class="cart-badge" id="count">0</span></button>
            <div class="customer-brand-row">
              <img class="main-logo" src="/el-cubano-logo-transparent.png?v={version}" alt="Ceviches y Cócteles El Cubano">
              <div class="customer-brand-copy"><strong>Ceviches & Cócteles</strong><span>El Cubano</span><small>Fresco · preparado al momento</small></div>
            </div>
            <div class="customer-food-hero"><img src="/ceviche-real.svg?v={version}" alt="Ceviche real preparado fresco"><div class="customer-food-copy"><strong>🥣 Ceviche real, preparado fresco</strong><span>Hecho al momento · Sabor que sí se antoja</span></div></div>
            <h1>¿Qué se te antoja hoy?</h1>
            <p>Programa tu pedido · Delivery gratis en área delimitada</p>
            <div class="benefits"><div class="benefit"><b>💯 Seguro</b>Sin anticipos</div><div class="benefit"><b>💵 Paga al recibir</b>Efectivo o Cash App</div><div class="benefit"><b>🚚 Delivery</b>Área delimitada</div></div>
          </header>'''
          html = re.sub(r'<header class="hero">.*?</header>', hero, html, count=1, flags=re.S)

          # Idioma visible desde el HTML, para que no aparezca tarde.
          language_switch = '<div id="language-switch"><button type="button" class="active" data-lang="es">🇲🇽 ES</button><span class="divider">|</span><button type="button" data-lang="en">🇺🇸 EN</button></div>'
          html = html.replace('<main class="wrap">', '<main class="wrap">' + language_switch, 1)

          # Aviso final de pedido anticipado.
          html = re.sub(
              r'<div class="availability-note">.*?</div>',
              '<div class="availability-note">📅 <b>Pedido con anticipación.</b> Para mantener la calidad y frescura de nuestros productos, solo recibimos pedidos de un día para otro. Gracias por tu comprensión.</div>',
              html, count=1, flags=re.S
          )

          # Navegación principal ya terminada en el HTML.
          nav = '''<div id="customer-category-nav" aria-label="Categorías del menú">
            <button type="button" class="active" data-group="promotions"><span class="cat-icon">🔥</span><span class="cat-label">Promociones</span></button>
            <button type="button" data-group="immediate"><span class="cat-icon">⚡</span><span class="cat-label">Ceviches</span></button>
            <button type="button" data-group="cocktails"><span class="cat-icon">🍹</span><span class="cat-label">Cócteles</span></button>
            <button type="button" data-group="preorder"><span class="cat-icon">📅</span><span class="cat-label">Sobre pedido</span></button>
            <button type="button" data-group="drinks"><span class="cat-icon">🥤</span><span class="cat-label">Refrescos</span></button>
          </div>'''
          html = html.replace('<section class="section promo-section open"', nav + '\n<section class="section promo-section open"', 1)

          # Mover avisos al lugar final DURANTE build, no después en el celular.
          info_blocks = re.findall(r'<div class="(?:notice|availability-note)">.*?</div>', html, flags=re.S)
          html = re.sub(r'<div class="(?:notice|availability-note)">.*?</div>', '', html, flags=re.S)
          info_html = '<div id="customer-info-after-menu">' + ''.join(info_blocks) + '</div>'
          html = html.replace('<section class="checkout" id="checkout">', info_html + '\n<section class="checkout" id="checkout">', 1)

          # Una sola lógica de tabs + horarios. Sin temporizadores visuales.
          behavior = r'''<script>
          (()=>{
            const nav=document.getElementById('customer-category-nav');
            function setActive(group){
              document.querySelectorAll('.section[data-group]').forEach(section=>{
                const open=section.dataset.group===group;
                section.classList.toggle('open',open);
                section.querySelector('.section-title')?.setAttribute('aria-expanded',open?'true':'false');
              });
              nav?.querySelectorAll('button[data-group]').forEach(button=>{
                const active=button.dataset.group===group;
                button.classList.toggle('active',active);
                button.setAttribute('aria-pressed',active?'true':'false');
              });
            }
            nav?.addEventListener('click',event=>{
              const button=event.target.closest('button[data-group]');
              if(button)setActive(button.dataset.group);
            });

            const localDateString=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
            const tomorrow=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+1);return localDateString(d)};
            const formatSlot=minutes=>{const hour=Math.floor(minutes/60),minute=minutes%60,period=hour>=12?'p. m.':'a. m.';return `${hour%12||12}:${String(minute).padStart(2,'0')} ${period}`};
            const dateInput=document.getElementById('date'),timeSelect=document.getElementById('time');
            if(dateInput){dateInput.min=tomorrow();if(dateInput.value&&dateInput.value<dateInput.min)dateInput.value=''}
            function refresh(){
              if(!timeSelect)return;
              const previous=timeSelect.value;
              timeSelect.innerHTML='<option value="">Selecciona un horario</option>';
              for(let minutes=660;minutes<1140;minutes+=20){const option=document.createElement('option');option.value=option.textContent=formatSlot(minutes);timeSelect.appendChild(option)}
              if([...timeSelect.options].some(o=>o.value===previous))timeSelect.value=previous;
            }
            refresh();
            dateInput?.addEventListener('change',()=>{if(dateInput.value&&dateInput.value<dateInput.min){dateInput.value='';alert('Solo recibimos pedidos de un día para otro.')}refresh()});
          })();
          </script>'''

          # Promo funcional: productos/precios/recetas. CERO CSS y CERO reacomodos.
          clean_promo = r'''(() => {
            const COCKTAIL_12_COST = 2.65;
            const cocktail12Recipe = {shrimp:0.1875,onion:0.5,cilantro:0.1,avocado:0.25,tomatoSauce:2.173,tomatoPuree:1.087,clamato:0.652,lemonJuice:0.065,english:0.011,maggi:0.011,container12:1,lid12:1,spoon:1,napkins:1};
            const copyRecipe=recipe=>Object.fromEntries(Object.entries(recipe||{}).map(([key,value])=>[key,Number(value)]));
            function setProduct(id,changes){if(typeof products==='undefined'||!Array.isArray(products))return null;const product=products.find(item=>item.id===id);if(product)Object.assign(product,changes);return product}
            if(typeof products==='undefined'||!Array.isArray(products))return;
