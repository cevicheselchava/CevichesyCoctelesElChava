            const camaradas=setProduct('promo_camaradas',{detail:'1 libra de pescado + 1 libra de camarón + 2 cócteles de camarón 12 oz',price:49,cost:15.12,promo:'Ahorras $6',inventoryNote:''});
            if(camaradas&&typeof addRecipes==='function'&&typeof fish1!=='undefined'&&typeof shrimp1!=='undefined')camaradas.recipe=addRecipes(fish1,shrimp1,cocktail12Recipe,cocktail12Recipe);
            const promoId='promo_personal_16';
